name: Build iOS IPA (Main App + Share Extension)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Compile & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Regenerate Xcode Project from project.yml
        run: |
          cd ios
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --spec project.yml
          elif command -v brew >/dev/null 2>&1; then
            brew install xcodegen
            xcodegen generate --spec project.yml
          else
            echo "xcodegen not available; using committed .xcodeproj"
          fi
          # XcodeGen 2.45+ defaults to the Xcode 16 format (objectVersion 77),
          # which the Xcode 15.4 runner cannot open. project.yml pins
          # projectFormat: xcode14_0 (objectVersion 56) — verify it stuck.
          if grep -q 'objectVersion = 77' GoonDrop.xcodeproj/project.pbxproj; then
            echo "::error::xcodegen wrote objectVersion 77; pin options.projectFormat older than xcode16_0 in project.yml"
            exit 1
          fi

      - name: Archive GoonDrop and ShareExtension
        run: |
          cd ios
          mkdir -p build/ipa/Payload
          
          xcodebuild archive \
            -project GoonDrop.xcodeproj \
            -scheme GoonDrop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GoonDrop.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned / Sideload-Ready IPA
        run: |
          cd ios
          echo "==> Packaging into IPA..."
          cp -r build/GoonDrop.xcarchive/Products/Applications/GoonDrop.app build/ipa/Payload/
          
          # Clean any build signatures so sideloading tools (AltStore, SideStore, Sideloadly) sign cleanly
          rm -rf build/ipa/Payload/GoonDrop.app/_CodeSignature
          if [ -d "build/ipa/Payload/GoonDrop.app/PlugIns/ShareExtension.appex" ]; then
            rm -rf build/ipa/Payload/GoonDrop.app/PlugIns/ShareExtension.appex/_CodeSignature
            echo "==> ShareExtension verified inside GoonDrop.app/PlugIns"
          else
            echo "==> Embedding ShareExtension into PlugIns folder..."
            mkdir -p build/ipa/Payload/GoonDrop.app/PlugIns
            if [ -d "build/GoonDrop.xcarchive/Products/Applications/ShareExtension.appex" ]; then
              cp -r build/GoonDrop.xcarchive/Products/Applications/ShareExtension.appex build/ipa/Payload/GoonDrop.app/PlugIns/
            fi
          fi
          
          cd build/ipa
          zip -qr ../../GoonDrop.ipa Payload
          cd ../..
          ls -lh GoonDrop.ipa

      - name: Package Extension-Free Sideload IPA
        run: |
          cd ios
          # Free Apple IDs / SideStore cannot register embedded app extensions
          # ("App Contains Extensions" / placeholder bundle ID mismatch) or
          # provision App Groups. The main app falls back to standard
          # UserDefaults without the extension, so this build is fully usable.
          rm -rf build/ipa-noext
          mkdir -p build/ipa-noext/Payload
          cp -r build/GoonDrop.xcarchive/Products/Applications/GoonDrop.app build/ipa-noext/Payload/
          rm -rf build/ipa-noext/Payload/GoonDrop.app/PlugIns
          rm -rf build/ipa-noext/Payload/GoonDrop.app/_CodeSignature
          cd build/ipa-noext
          zip -qr ../../GoonDrop-NoExtension.ipa Payload
          cd ../..
          ls -lh GoonDrop.ipa GoonDrop-NoExtension.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoonDrop-iOS-IPA
          path: |
            ios/GoonDrop.ipa
            ios/GoonDrop-NoExtension.ipa
          retention-days: 30
